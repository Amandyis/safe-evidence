@if (isMenuAberto()) {
  <div
    class="fixed inset-0 z-30 bg-black/40 lg:hidden"
    aria-hidden="true"
    (click)="solicitarFechamento()"
  ></div>
}

<aside
  id="menu-lateral"
  class="menu-lateral fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-gray-200 bg-white lg:static lg:h-screen"
  [class.menu-lateral--fechado]="!isMenuAberto()"
  aria-label="Menu principal"
>
  <div class="flex items-start justify-between px-6 pt-6 pb-8">
    <div>
      <h1 class="text-lg font-bold text-blue-900">Safe Evidence</h1>
      <span class="text-[11px] tracking-widest text-gray-500 uppercase">Secure Archive</span>
    </div>
    <button
      type="button"
      class="rounded-md p-1 text-gray-500 hover:bg-gray-100 lg:hidden"
      aria-label="Fechar menu"
      (click)="solicitarFechamento()"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <nav class="flex-1">
    <ul>
      @for (itemNavegacao of itensNavegacao; track itemNavegacao.rota) {
        <li>
          <a
            class="item-navegacao flex items-center gap-3 border-r-4 border-transparent px-6 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50"
            [routerLink]="itemNavegacao.rota"
            routerLinkActive="item-navegacao--ativo"
            (click)="solicitarFechamento()"
          >
            <i [class]="itemNavegacao.classeIcone"></i>
            {{ itemNavegacao.rotulo }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="flex items-center gap-3 border-t border-gray-200 px-6 py-4">
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-blue-100 text-sm font-semibold text-blue-900"
      aria-hidden="true"
    >
      {{ iniciaisUsuario() }}
    </span>
    <div class="min-w-0">
      <p class="truncate text-sm font-semibold text-gray-900">{{ nomeUsuario() }}</p>
      <p class="truncate text-xs text-gray-500">{{ cargoUsuario() }}</p>
    </div>
  </div>
</aside>
