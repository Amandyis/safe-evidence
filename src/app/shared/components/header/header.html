<header class="flex items-center gap-3 border-b border-gray-200 bg-white px-4 py-3 sm:px-6">
  <button
    type="button"
    class="rounded-md p-2 text-gray-700 hover:bg-gray-100 lg:hidden"
    aria-label="Abrir menu"
    aria-controls="menu-lateral"
    [attr.aria-expanded]="isMenuLateralAberto()"
    (click)="solicitarAberturaMenu()"
  >
    <i class="pi pi-bars text-lg"></i>
  </button>
  <a routerLink="/inicio" class="font-bold text-blue-900 hover:text-blue-950 lg:hidden">
    Safe Evidence
  </a>

  <div class="ml-auto flex items-center gap-2">
    <a
      routerLink="/perfil"
      class="flex rounded-full p-2 text-gray-700 hover:bg-gray-100"
      aria-label="Meu perfil"
    >
      <i class="pi pi-user text-lg"></i>
    </a>
  </div>
</header>
