@if (isAvisoVisivel()) {
  <div
    class="fixed inset-x-4 bottom-4 z-50 mx-auto max-w-md rounded-lg border border-amber-200 bg-white p-4 shadow-lg sm:inset-x-auto sm:right-6"
    role="alertdialog"
    aria-labelledby="titulo-aviso-inatividade"
    aria-describedby="descricao-aviso-inatividade"
  >
    <p id="titulo-aviso-inatividade" class="flex items-center gap-2 font-semibold text-amber-800">
      <i class="pi pi-clock" aria-hidden="true"></i>
      Sua sessão está prestes a expirar
    </p>
    <p id="descricao-aviso-inatividade" class="mt-1 text-sm text-gray-600" aria-live="polite">
      Por segurança, você será desconectada por inatividade em
      <span class="font-mono font-semibold text-gray-900">{{ tempoRestanteFormatado() }}</span
      >.
    </p>
    @if (mensagemErro(); as erro) {
      <p class="mt-2 text-xs text-red-700">{{ erro }}</p>
    }
    <div class="mt-3 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
        (click)="sairAgora()"
      >
        Sair agora
      </button>
      <button
        type="button"
        class="flex items-center justify-center gap-2 rounded-md bg-blue-900 px-4 py-2 text-sm font-medium text-white hover:bg-blue-950 disabled:opacity-60"
        [disabled]="isRenovando()"
        (click)="continuarConectada()"
      >
        <i
          [class]="isRenovando() ? 'pi pi-spin pi-spinner' : 'pi pi-refresh'"
          aria-hidden="true"
        ></i>
        Continuar conectada
      </button>
    </div>
  </div>
}
